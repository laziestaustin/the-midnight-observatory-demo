<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101b20">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4L30 18L44 24L30 30L24 44L18 30L4 24L18 18Z' fill='%23c9b58b'/%3E%3C/svg%3E">
  <title>午夜天文台 · 在线试玩</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0c171c;color:#ded5be;font-family:"Microsoft YaHei","Noto Serif CJK SC",serif;min-height:100vh;display:grid;place-items:center}main{width:min(1180px,100%);padding:38px 28px}header{text-align:center;margin-bottom:30px}.eyebrow{font:12px Georgia,serif;letter-spacing:.28em;color:#9eafa7}h1{font-size:clamp(30px,5vw,49px);font-weight:400;letter-spacing:.13em;margin:16px 0}header p{font-size:16px;line-height:1.9;color:#a9b8af;margin:0}.roles{display:grid;grid-template-columns:1fr 1fr;gap:22px}.role{display:block;position:relative;overflow:hidden;border:1px solid #5e6c62;border-radius:3px;color:inherit;text-decoration:none;background:#17252b}.role img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;display:block}.caption{padding:21px 24px 24px;border-top:1px solid #44534f}.caption h2{margin:0 0 10px;font-size:25px;font-weight:400}.caption p{margin:0;color:#a9b9b0;line-height:1.8;font-size:15px}.enter{display:block;margin-top:20px;color:#deca9c;font-size:18px}.future .enter{color:#afd0ca}.role:hover,.role:focus-visible{border-color:#ddc795;outline:2px solid #ddc795;outline-offset:3px}.role:active{transform:translateY(1px)}footer{margin:26px auto 0;text-align:center;max-width:760px;font-size:13px;line-height:1.9;color:#8d9f95}footer p{margin:7px 0}.version{color:#697f77;font:12px Georgia,serif;letter-spacing:.1em}@media(max-width:680px){main{padding:26px 20px}.roles{grid-template-columns:1fr}.caption{padding:17px 20px}.caption h2{font-size:22px}header p{font-size:14px}.eyebrow{font-size:10px;letter-spacing:.17em}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">THE MIDNIGHT OBSERVATORY</div>
      <h1>午夜天文台</h1>
      <p>第一至第二幕 · 双人在线试玩<br>两位玩家各选一个角色，并保持语音通话。</p>
    </header>
    <div class="roles">
      <a class="role" href="A/" data-role="A" aria-label="进入 A 观测员，1986年">
        <img src="A/art/hall-1986.png" width="1672" height="941" alt="1986年的观测大厅" fetchpriority="high">
        <div class="caption"><h2>A · 观测员 / 1986</h2><p>拨开透镜上的尘埃，寻找过去的星光。</p><span class="enter">进入 1986 →</span></div>
      </a>
      <a class="role future" href="B/" data-role="B" aria-label="进入 B 档案员，2066年">
        <img src="B/art/hall-2066.png" width="1672" height="941" alt="2066年的同一座观测大厅">
        <div class="caption"><h2>B · 档案员 / 2066</h2><p>读懂留下的星图，回应八十年前的声音。</p><span class="enter">进入 2066 →</span></div>
      </a>
    </div>
    <footer>
      <p>直接在浏览器中开始，无需下载或安装。鼠标与触屏均可操作，横屏体验最佳。</p>
      <p>进度保存在当前浏览器；两个角色独立记录。第二幕为标识清楚的交互样机，美术仍在制作中。</p>
      <div class="version">PLAYTEST 0.8.1</div>
    </footer>
  </main>
</body>
</html>
